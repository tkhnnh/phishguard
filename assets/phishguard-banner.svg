<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PhishGuard — Phishing detection for your inbox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#122036"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <g fill="#1e2f4a" opacity="0.5">
    <circle cx="980" cy="60" r="3"/>
    <circle cx="1030" cy="60" r="3"/>
    <circle cx="1080" cy="60" r="3"/>
    <circle cx="1130" cy="60" r="3"/>
    <circle cx="980" cy="110" r="3"/>
    <circle cx="1030" cy="110" r="3"/>
    <circle cx="1080" cy="110" r="3"/>
    <circle cx="1130" cy="110" r="3"/>
  </g>

  <!-- Shield emblem -->
  <g transform="translate(96,72)" filter="url(#soft)">
    <path d="M110 8 L206 44 V132 C206 190 166 224 110 240 C54 224 14 190 14 132 V44 Z"
          fill="url(#shield)"/>
    <path d="M110 8 L206 44 V132 C206 190 166 224 110 240 C54 224 14 190 14 132 V44 Z"
          fill="none" stroke="#7ff3e6" stroke-opacity="0.35" stroke-width="2"/>

    <!-- Envelope inside the shield -->
    <g transform="translate(48,74)">
      <rect x="0" y="0" width="124" height="84" rx="10" fill="#0b1220"/>
      <path d="M6 10 L62 52 L118 10" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Check mark overlay -->
      <path d="M40 58 L58 76 L92 40" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(360,150)">
    <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="86" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Phish<tspan fill="#2dd4bf">Guard</tspan>
    </text>
    <text x="4" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="#93a4bd">
      Phishing detection for your inbox
    </text>
    <!-- Accent underline -->
    <rect x="4" y="78" width="360" height="5" rx="2.5" fill="url(#accent)"/>
  </g>
</svg>
